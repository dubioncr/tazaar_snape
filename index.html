<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }

      #scanning-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
        background: rgba(0, 0, 0, 0.2);
        pointer-events: none;
      }

      .scan-message {
        background: rgba(0, 0, 0, 0.7);
        color: #D4AF37;
        padding: 20px 40px;
        border-radius: 50px;
        border: 2px solid #D4AF37;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
        100% { opacity: 0.6; transform: scale(1); }
      }

      .hidden { display: none !important; }
    </style>

    <script>
      // Componente para aplicar el video exclusivamente al material MAT_TAZA
      AFRAME.registerComponent('apply-video-to-material', {
        init: function () {
          const el = this.el;
          const video = document.querySelector('#mcgonagalVideo');

          el.addEventListener('model-loaded', () => {
            const mesh = el.getObject3D('mesh');
            if (!mesh) return;

            // Crear la textura de video para Three.js
            const texture = new THREE.VideoTexture(video);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            // --- CORRECCIÓN PARA EL VIDEO DE CABEZA ---
            texture.repeat.y = -1;
            texture.offset.y = 1;

            // Recorrer las mallas buscando el material MAT_TAZA
            mesh.traverse((node) => {
              if (node.isMesh && node.material) {
                if (node.material.name === "MAT_TAZA") {
                  node.material.map = texture;
                  node.material.map.needsUpdate = true;
                  node.material.needsUpdate = true;
                }
              }
            });
          });
        }
      });
    </script>
  </head>
  <body>

    <div id="scanning-overlay">
      <div class="scan-message">Enfoca la taza</div>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Video fuente -->
        <video 
          id="mcgonagalVideo" 
          src="snape_1.mp4" 
          preload="auto" 
          loop="true" 
          crossorigin="anonymous" 
          webkit-playsinline 
          playsinline>
        </video>

        <!-- Modelo GLB -->
        <a-asset-item id="planoTazaModel" src="plano_taza.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target0" mindar-image-target="targetIndex: 0">
        <!-- Se aplica el componente personalizado de material -->
        <a-gltf-model 
          src="#planoTazaModel" 
          apply-video-to-material
          position="0 0 -0.55" 
          rotation="0 0 0" 
          scale="1.6 1.6 1.6">
        </a-gltf-model>
      </a-entity>
      
    </a-scene>

    <script>
      const overlay = document.getElementById('scanning-overlay');
      const targetEntity = document.getElementById('target0');
      const video = document.querySelector('#mcgonagalVideo');

      targetEntity.addEventListener("targetFound", () => {
        overlay.classList.add("hidden");
        video.play();
      });

      targetEntity.addEventListener("targetLost", () => {
        overlay.classList.remove("hidden");
        video.pause();
      });

      window.addEventListener('click', () => {
        video.load();
      }, { once: true });
    </script>
  </body>
</html>
